<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Трекер: алкоголь и кальян</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: friendly personal habit app, calm and non-judgmental, like the reference app.
   IDEA: a glass that fills up — calendar days fill red with what was drunk, hookah days get a violet smoke mark.
   PICTURE: the calendar month itself is the picture; stats use donut + stacked bars.
   COLOUR and TYPE: white / near-black ground, coral-red for alcohol, violet for hookah; Manrope.
   LAYOUT: phone-first single column, bottom tab bar, sheets slide up for editing. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#111114);--card:light-dark(#f4f4f7,#1d1d23);--ink:light-dark(#121217,#f1f1f5);--mut:light-dark(#8a8fa8,#9296ab);
--line:light-dark(#ececf1,#2a2a33);--red:#ef3b56;--hk:#7b5cf0;--glass:light-dark(#aeb2c4,#646879);--gf:light-dark(rgba(255,255,255,.35),rgba(255,255,255,.06));
--c-wine:#e5233b;--c-beer:#2f86d6;--c-strong:light-dark(#34455e,#9fb3cf);--c-other:#f28c5b;
--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Manrope,system-ui,-apple-system,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
input{font:inherit;font-size:16px;color:var(--ink)}
.app{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + var(--tg-content-safe-area-inset-top,0px) + 8px) 16px calc(96px + var(--safe-b))}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:52px;margin-bottom:4px}
.top h1{grid-column:2;margin:0;font-size:20px;font-weight:700;text-align:center;white-space:nowrap}
.back{justify-self:start;color:var(--red);font-weight:700;display:flex;align-items:center;gap:4px;min-height:44px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 -16px 14px;padding:0 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;padding:12px 10px;font-weight:700;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap;font-size:15px}
.tabs button.on{color:var(--ink);border-color:var(--red)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border-radius:14px;padding:4px;margin-bottom:16px}
.seg button{min-height:40px;border-radius:10px;font-weight:700;color:var(--mut);font-size:15px}
.seg button.on{background:var(--bg);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.seg button.on.alc{color:var(--red)}.seg button.on.hk{color:var(--hk)}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + var(--safe-b));z-index:5}
.tabbar button{display:grid;place-items:center;gap:2px;min-width:72px;min-height:48px;color:var(--glass);font-size:11px;font-weight:700}
.tabbar button.on{color:var(--red)}
.tabbar svg{width:26px;height:26px}
/* calendar */
.mhead{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
.mhead h2{margin:0;font-size:24px;font-weight:800}.mhead h2 span{color:var(--mut)}
.arr{width:44px;height:44px;border-radius:12px;background:var(--card);display:grid;place-items:center;font-size:22px;color:var(--mut)}
.wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--card);border-radius:12px;padding:8px 0;margin-bottom:8px}
.wd span{text-align:center;color:var(--mut);font-weight:700;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:6px}
.cd{display:grid;justify-items:center;gap:3px;padding:4px 0;min-height:62px;align-content:start}
.cup{width:min(42px,11vw);aspect-ratio:1;border-radius:50% 50% 46% 46%;display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--card);color:var(--mut);position:relative}
.cup.on{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);background:linear-gradient(to top,var(--red) var(--lv),color-mix(in srgb,var(--red) 38%,var(--bg)) var(--lv))}
.cd.tod .cup{box-shadow:0 0 0 2px var(--ink)}
.cd.fut{opacity:.35;pointer-events:none}
.smoke{height:12px;display:flex;align-items:center;gap:2px;color:var(--hk);font-size:11px;font-weight:800}
.smoke i{width:8px;height:8px;border-radius:50%;background:var(--hk)}
.msum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.msum div{background:var(--card);border-radius:16px;padding:12px;text-align:center}
.msum b{display:block;font-size:22px;font-weight:800}.msum small{color:var(--mut);font-size:13px;font-weight:600}
.yr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 14px}
.ym{text-align:center}.ym h3{margin:0 0 6px;font-size:15px;font-weight:800}
.yd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;justify-items:center}
.yd i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.yd i.a{background:var(--red)}.yd i.h{background:var(--hk)}.yd i.ah{background:linear-gradient(90deg,var(--red) 50%,var(--hk) 50%)}.yd i.f{opacity:.4}.yd i.e{background:none}
.legend{display:flex;gap:16px;justify-content:center;margin-top:18px;color:var(--mut);font-size:13px;font-weight:600;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:50%}
/* day */
.dnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.dnav h2{margin:0;font-size:22px;font-weight:800;text-align:center;flex:1}
.list{display:grid;gap:8px;margin-bottom:16px}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:8px 8px 8px 10px}
.item .gl{width:28px;height:40px;flex:none}
.item .tx{flex:1}.item b{display:block;font-size:15px}.item small{color:var(--mut);font-size:13px;font-weight:600}
.del{width:40px;height:40px;border-radius:12px;color:var(--mut);font-size:20px;flex:none}
.empty{color:var(--mut);text-align:center;padding:14px;font-weight:600;font-size:15px}
.drinks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dr{background:var(--card);border-radius:20px;padding:12px 6px 12px;display:grid;justify-items:center;gap:4px;text-align:center;position:relative;min-height:150px}
.dr .gl{width:46px;height:66px}
.dr b{font-size:14px;line-height:1.2}.dr small{color:var(--mut);font-size:12px}
.dr .cnt{position:absolute;top:8px;right:8px;background:var(--red);color:#fff;border-radius:10px;font-size:12px;font-weight:800;padding:1px 7px}
.gs{fill:var(--gf);stroke:var(--glass);stroke-width:1.4;stroke-linejoin:round}
.gk{fill:none;stroke:var(--glass);stroke-width:2;stroke-linecap:round}
.btn{display:block;width:100%;min-height:54px;border-radius:16px;background:var(--red);color:#fff;font-weight:800;font-size:16px;margin-top:16px}
.btn.hkb{background:var(--hk)}.btn.ghost{background:var(--card);color:var(--ink)}
.btn:disabled{opacity:.5}
.field{margin-bottom:14px}.field>label,.lbl{display:block;font-weight:700;font-size:14px;margin-bottom:6px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:0 14px;border-radius:12px;background:var(--card);font-weight:700;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg)}
.inp{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hkform{background:var(--card);border-radius:20px;padding:14px}
.hkform .inp{background:var(--bg)}.hkform .chip{background:var(--bg)}.hkform .chip.on{background:var(--hk);color:#fff}
/* sheet */
.veil{position:fixed;inset:0;background:rgba(10,10,16,.45);z-index:10;display:none}
.veil.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 16px calc(20px + var(--safe-b));z-index:11;transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s;max-width:560px;margin:0 auto}
.sheet.open{transform:none;visibility:visible;transition:transform .25s ease}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h3{margin:0 0 4px;font-size:20px;font-weight:800;text-align:center}
.sheet .sub{text-align:center;color:var(--mut);font-size:14px;margin:0 0 14px}
.conts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ct{background:var(--card);border-radius:18px;padding:10px;display:grid;justify-items:center;gap:6px;text-align:center}
.ct .gl{width:38px;height:54px}.ct b{font-size:15px}.ct small{color:var(--mut);font-size:13px}
.step{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;width:100%}
.step button{height:44px;border-radius:12px;background:var(--bg);font-size:22px;font-weight:700}
.step span{text-align:center;font-weight:800;font-size:18px}
.ct .inp{min-height:42px;text-align:center}
/* stats */
.donutw{background:var(--card);border-radius:22px;padding:18px;margin-bottom:14px}
.donut{width:min(210px,60vw);aspect-ratio:1;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center}
.hole{width:74%;aspect-ratio:1;border-radius:50%;background:var(--card);display:grid;place-content:center;text-align:center}
.hole small{color:var(--mut);font-weight:600}.hole b{font-size:clamp(26px,8vw,36px);font-weight:800;line-height:1.1}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tag{border-radius:14px;padding:6px 12px;font-weight:700;font-size:14px;color:#fff}
.band3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--red);color:#fff;border-radius:22px;padding:18px 6px;margin-bottom:14px;text-align:center}
.band3.hkc{background:var(--hk)}
.band3 div+div{border-left:1px solid rgba(255,255,255,.5)}
.band3 b{display:block;font-size:clamp(30px,10vw,44px);font-weight:800;line-height:1.1}
.band3 small{font-size:13px;font-weight:700;display:block;padding:0 6px;line-height:1.25}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
.tiles.t2{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{background:var(--card);border-radius:18px;padding:10px 6px;text-align:center;display:grid;justify-items:center;gap:2px}
.tile .gl{width:28px;height:40px}.tile small{color:var(--mut);font-size:12px;font-weight:700;line-height:1.2}.tile b{font-size:16px;font-weight:800;white-space:nowrap}
.tile.big{padding:14px}.tile.big b{font-size:22px}
.sec{margin:20px 0 10px;font-size:18px;font-weight:800}
.plot{position:relative;height:190px;margin:8px 0 0 38px}
.gl0{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.gl0 span{position:absolute;right:calc(100% + 6px);top:-9px;font-size:12px;color:var(--mut);font-weight:700;white-space:nowrap}
.cols{position:absolute;inset:0;display:flex;align-items:flex-end;gap:2px}
.col{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center}
.stk{width:min(72%,30px);display:flex;flex-direction:column-reverse;border-radius:5px 5px 0 0;overflow:hidden}
.stk i{display:block;min-height:0}
.xl{display:flex;gap:2px;margin-left:38px;margin-top:6px}
.xl span{flex:1;text-align:center;font-size:12px;color:var(--mut);font-weight:700;white-space:nowrap;overflow:visible}
.total{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--red);color:#fff;border-radius:20px;padding:18px 20px;margin:18px 0 6px;font-weight:800}
.total b{font-size:clamp(24px,8vw,34px);white-space:nowrap}.total.hkc{background:var(--hk)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 0;border-bottom:1px solid var(--line);font-weight:700}
.kv b{color:var(--red);font-size:18px;text-align:right}.kv b.v{color:var(--hk)}
.hbar{display:grid;grid-template-columns:7.5em 1fr auto;align-items:center;gap:10px;margin-bottom:8px;font-weight:700;font-size:14px}
.hbar .tr{height:12px;border-radius:6px;background:var(--card);overflow:hidden}.hbar .tr i{display:block;height:100%;background:var(--hk);border-radius:6px}
/* settings */
.set{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px}
.set h3{margin:0 0 10px;font-size:16px;font-weight:800}
.set p{margin:0 0 10px;color:var(--mut);font-size:14px}
.set .chip{background:var(--bg)}.set .chip.on{background:var(--ink);color:var(--bg)}
textarea{width:100%;min-height:110px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,monospace;padding:10px}
.status{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}.status i{width:10px;height:10px;border-radius:50%;background:var(--mut)}
.status.cloud i{background:#1fb86a}.status.err i{background:#f0a020}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.sheet,.toast{transition:none}}
@media(max-width:380px){.drinks{gap:8px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabbar" id="tabbar">
  <button data-act="nav" data-v="stats" aria-label="Статистика"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="11" width="5" height="10" rx="1"/><rect x="9.5" y="7" width="5" height="14" rx="1"/><rect x="16" y="3" width="5" height="18" rx="1"/></svg>Статистика</button>
  <button data-act="nav" data-v="cal" aria-label="Календарь"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 2h2v2h6V2h2v2h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2zm-1 7v3h4V9z"/></svg>Календарь</button>
  <button data-act="nav" data-v="set" aria-label="Настройки"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.3 2h3.4l.5 2.6 1.8.8 2.2-1.5 2.4 2.4-1.5 2.2.8 1.8 2.6.5v3.4l-2.6.5-.8 1.8 1.5 2.2-2.4 2.4-2.2-1.5-1.8.8-.5 2.6h-3.4l-.5-2.6-1.8-.8-2.2 1.5-2.4-2.4 1.5-2.2-.8-1.8L2 13.7v-3.4l2.6-.5.8-1.8-1.5-2.2 2.4-2.4 2.2 1.5 1.8-.8zM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"/></svg>Настройки</button>
</nav>
<div class="veil" id="veil" data-act="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>
<script>
{
/* ---------- справочники ---------- */
const CATS={wine:{n:'Вино',c:'var(--c-wine)',g:'wine',col:'#c3162b'},beer:{n:'Пиво',c:'var(--c-beer)',g:'pint',col:'#f3b313'},strong:{n:'Крепкий алкоголь',c:'var(--c-strong)',g:'rocks',col:'#c9721e'},other:{n:'Другое',c:'var(--c-other)',g:'martini',col:'#3fe0b0'}};
const CAT_IDS=['wine','beer','strong','other'];
// id, категория, название, средняя крепость %, диапазон, бокал, цвет напитка
const BASE=[
['champ','wine','Шампанское',12,'9–16%','flute','#efdf7e'],['red','wine','Вино красное',13,'9–16%','wine','#c3162b'],
['white','wine','Вино белое',12,'9–16%','wine','#efe39a'],['rose','wine','Вино розовое',12,'9–16%','wine','#f3a3a0'],
['port','wine','Портвейн',19,'17–23%','snifter','#7a1020'],
['light','beer','Пиво светлое',5,'4–9%','bottle','#f3b313'],['dark','beer','Пиво тёмное',6,'4–12%','bottle','#3a1410'],
['ale','beer','Эль',6,'5–9%','bottle','#6a2a14'],['unf','beer','Нефильтрованное',5,'3–8%','pint','#e8cf6a'],['cider','beer','Сидр',5,'2–9%','pint','#d93b4a'],
['gin','strong','Джин',40,'37–47%','martini','#8fd0ff'],['rum','strong','Ром',40,'35–48%','rocks','#b4561c'],['brandy','strong','Бренди',40,'37–60%','snifter','#c9721e'],
['tequila','strong','Текила',38,'35–55%','shot','#f3ea7a'],['cognac','strong','Коньяк',40,'40–45%','snifter','#d9861c'],['vodka','strong','Водка',40,'40–56%','shot','#cfe6f2'],
['whisky','strong','Виски',40,'40–46%','rocks','#d88a2a'],['shot','strong','Шот',30,'20–40%','shot','#4ad06a'],
['cocktail','other','Коктейли',12,'2–30%','martini','#3fe0b0']
].map(([id,cat,name,abv,range,g,col])=>({id,cat,name,abv,range,g,col}));
const CONT={
 wine:[['m','Средний бокал',125,'wine'],['g','Бокал',150,'wine'],['b','Бутылка',750,'bottle'],['j','Кувшин',1000,'pint']],
 beer:[['s','Бутылка 0,33',330,'bottle'],['b','Бутылка 0,5',500,'bottle'],['p','Пинта',568,'pint'],['k','Кружка 1 л',1000,'pint']],
 strong:[['s','Шот',50,'shot'],['d','Двойной',100,'rocks'],['b5','Бутылка 0,5',500,'bottle'],['b7','Бутылка 0,7',700,'bottle']],
 other:[['g','Бокал',200,'martini'],['l','Лонг',330,'pint'],['j','Кувшин',1000,'pint']]
};
const PLACES={home:'Дома',lounge:'Кальянная',guest:'В гостях'};
const STR={light:'Лёгкий',medium:'Средний',strong:'Крепкий'};
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MGEN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MSH=['янв.','февр.','март','апр.','май','июнь','июль','авг.','сент.','окт.','нояб.','дек.'];
const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const PAL=['#ef3b56','#f59e0b','#3b82f6','#10b981','#8b5cf6','#ec4899','#14b8a6','#f97316','#64748b','#84cc16'];

/* ---------- Telegram ---------- */
// Открыто внутри Telegram, если есть initData. Иначе приложение работает как обычная страница.
const TW=window.Telegram&&window.Telegram.WebApp;
const tg=TW&&TW.initData?TW:null;
const hap=t=>{try{if(!tg||!tg.HapticFeedback)return;t==='ok'?tg.HapticFeedback.notificationOccurred('success'):tg.HapticFeedback.selectionChanged()}catch(e){}};
if(tg){
  try{tg.ready();tg.expand();if(tg.isVersionAtLeast('7.7'))tg.disableVerticalSwipes()}catch(e){}
  const theme=()=>{const dark=tg.colorScheme==='dark';document.documentElement.dataset.theme=dark?'dark':'light';
    try{if(tg.isVersionAtLeast('6.1')){tg.setHeaderColor(dark?'#111114':'#ffffff');tg.setBackgroundColor(dark?'#111114':'#ffffff')}}catch(e){}};
  theme();tg.onEvent('themeChanged',theme);
}

/* ---------- утилиты ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

/* ---------- хранение: облако Telegram (CloudStorage бота) + копия в браузере ---------- */
// Каждый месяц хранится как JSON, разбитый на куски по 4000 символов: ключи m2026-11_0, m2026-11_1, ...
// Настройки — ключи settings_0, ... Лимиты Telegram: 1024 ключа, значение до 4096 символов.
const hasCS=!!(tg&&tg.CloudStorage&&tg.isVersionAtLeast&&tg.isVersionAtLeast('6.9'));
const CHUNK=4000;
let sync=hasCS?'loading':'local',dirty=new Set(),flushT=null,flushing=false,ready=false,chunks={};
const cs=(m,...a)=>new Promise((res,rej)=>{try{tg.CloudStorage[m](...a,(err,v)=>err?rej(err):res(v))}catch(e){rej(e)}});
function save(mk){
  try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}
  if(mk)dirty.add(mk);
  if(ready){clearTimeout(flushT);flushT=setTimeout(flush,600)}
}
function monthBody(id){const p=id.slice(1),o={};for(const k in state.days)if(k.startsWith(p))o[k]=state.days[k];return{days:o}}
async function writeDoc(id,str){
  const n=str==null?0:Math.max(1,Math.ceil(str.length/CHUNK));
  for(let i=0;i<n;i++)await cs('setItem',id+'_'+i,str.slice(i*CHUNK,(i+1)*CHUNK));
  const old=chunks[id]||0;
  if(old>n){const ks=[];for(let i=n;i<old;i++)ks.push(id+'_'+i);await cs('removeItems',ks)}
  chunks[id]=n;
}
async function flush(){
  if(flushing||!ready)return;flushing=true;
  try{
    while(dirty.size){
      const id=[...dirty][0];dirty.delete(id);
      let str=null;
      if(id==='settings')str=JSON.stringify(state.settings);
      else{const b=monthBody(id);if(Object.keys(b.days).length)str=JSON.stringify(b)}
      try{await writeDoc(id,str)}catch(e){dirty.add(id);setSync('err');return}
    }
    setSync('cloud');
  }finally{flushing=false;if(dirty.size&&sync==='cloud')setTimeout(flush,300)}
}
function setSync(s){if(sync===s)return;sync=s;if(view==='set')render()}
async function initCloud(){
  if(!hasCS)return;
  try{
    const keys=await cs('getKeys')||[];
    const groups={};
    for(const k of keys){const m=/^(settings|m\d{4}-\d\d)_(\d+)$/.exec(k);if(m)(groups[m[1]]=groups[m[1]]||[]).push(+m[2])}
    const all=Object.entries(groups).flatMap(([id,ix])=>ix.map(i=>id+'_'+i));
    const vals={};
    for(let i=0;i<all.length;i+=20)Object.assign(vals,await cs('getItems',all.slice(i,i+20))||{});
    const remote=new Set();
    for(const [id,ix] of Object.entries(groups)){
      ix.sort((a,b)=>a-b);chunks[id]=ix[ix.length-1]+1;
      let body;try{body=JSON.parse(ix.map(i=>vals[id+'_'+i]||'').join(''))}catch(e){continue}
      if(id==='settings')state.settings=normState({settings:body}).settings;
      else{
        remote.add(id);
        for(const k of Object.keys(state.days))if(monthOf(k)===id)delete state.days[k];
        Object.assign(state.days,normState({days:body.days}).days);
      }
    }
    for(const k of Object.keys(state.days)){const m=monthOf(k);if(!remote.has(m))dirty.add(m)}
    if(!groups.settings)dirty.add('settings');
    ready=true;sync='cloud';save();render();flush();
  }catch(e){sync='err';render()}
}

/* ---------- статистика ---------- */
function range(){
  const t=today();let start,unit;
  if(per==='week'){start=addDays(t,-6);unit='d'}
  else if(per==='month'){start=addDays(t,-29);unit='d'}
  else if(per==='half'){start=new Date(t.getFullYear(),t.getMonth()-5,1);unit='m'}
  else if(per==='year'){start=new Date(t.getFullYear(),t.getMonth()-11,1);unit='m'}
  else{const ks=Object.keys(state.days).sort();start=ks.length?parse(ks[0]):t;if(start>t)start=t;unit=(t-start)/864e5<31?'d':'m';if(unit==='d'&&(t-start)/864e5<6)start=addDays(t,-6);if(unit==='m')start=new Date(start.getFullYear(),start.getMonth(),1)}
  const days=[];for(let d=new Date(start);d<=t;d=addDays(d,1))days.push(key(d));
  const bs=[];
  if(unit==='d')days.forEach(k=>{const d=parse(k);bs.push({lab:per==='week'||days.length<=7?WD[(d.getDay()+6)%7]:String(d.getDate()),keys:[k]})});
  else for(const k of days){const mk=k.slice(0,7);let b=bs[bs.length-1];if(!b||b.mk!==mk){b={mk,lab:MSH[+k.slice(5,7)-1].replace('.',''),keys:[]};bs.push(b)}b.keys.push(k)}
  return{days,bs};
}
function streaks(arr){let on=0,off=0,a=0,b=0;for(const x of arr){if(x){a++;b=0}else{b++;a=0}on=Math.max(on,a);off=Math.max(off,b)}return[on,off]}
function nice(v){if(v<=0)return 1;const e=10**Math.floor(Math.log10(v)),f=v/e;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function chart(bs,series,fmt){
  const tot=bs.map((_,i)=>series.reduce((s,x)=>s+x.vals[i],0)),mx=nice(Math.max(0,...tot)),every=Math.ceil(bs.length/8);
  const lines=[0,.25,.5,.75,1].map(q=>`<div class="gl0" style="bottom:${q*100}%"><span>${fmt(mx*q)}</span></div>`).join('');
  const cols=bs.map((_,i)=>`<div class="col"><div class="stk" style="height:${tot[i]/mx*100}%">${series.map(x=>x.vals[i]>0?`<i style="flex:${x.vals[i]};background:${x.c}"></i>`:'').join('')}</div></div>`).join('');
  const labs=bs.map((b,i)=>`<span>${(i%every===0||i===bs.length-1)&&(bs.length<=10||i%every===0)?esc(b.lab):''}</span>`).join('');
  return `<div class="plot">${lines}<div class="cols">${cols}</div></div><div class="xl">${labs}</div>`;
}

function donut(parts){const t=parts.reduce((s,p)=>s+p.v,0);if(!t)return 'var(--line)';let a=0;return 'conic-gradient('+parts.map(p=>{const s=a;a+=p.v/t*360;return `${p.c} ${s}deg ${a}deg`}).join(',')+')'}

function statsAlc(days,bs){
  const byDrink={},spendCat={wine:0,beer:0,strong:0,other:0};let L=0,P=0,E=0;
  const perDay={};
  for(const k of days){const r=getDay(k);let dl=0,dp=0;
    for(const e of r.a){const v=e.v*e.n/1000,p=e.p*e.n;spendCat[e.c]+=p;if(sCat!=='all'&&e.c!==sCat)continue;
      dl+=v;dp+=p;byDrink[e.d]=(byDrink[e.d]||0)+v;E+=e.v*e.n*(drink(e.d).abv||0)/100}
    L+=dl;P+=dp;perDay[k]={L:dl,P:dp}}
  const parts=Object.entries(byDrink).sort((a,b)=>b[1]-a[1]).map(([id,v],i)=>({id,v,c:PAL[i%PAL.length]}));
  const flags=days.map(k=>perDay[k].L>0),[on,off]=streaks(flags),cnt=flags.filter(Boolean).length;
  let h=`<div class="donutw"><div class="donut" style="background:${donut(parts)}"><div class="hole"><small>Всего</small><b>${fL(L)} л</b></div></div>
  <div class="tags">${parts.length?parts.map(p=>`<span class="tag" style="background:${p.c}">${esc(drink(p.id).name)} ${fL(p.v)} л</span>`).join(''):'<span class="empty" style="padding:0">Нет записей за период</span>'}</div></div>`;
  h+=`<div class="band3"><div><b>${cnt}</b><small>${pl(cnt,'день','дня','дней')} пили</small></div><div><b>${on}</b><small>макс. дней подряд пили</small></div><div><b>${off}</b><small>макс. дней подряд не пили</small></div></div>`;
  h+=`<div class="tiles">${CAT_IDS.map(c=>{const d=BASE.find(b=>b.cat===c);return `<div class="tile">${glass(d.g,d.col)}<small>${c==='strong'?'Крепкий':CATS[c].n}</small><b style="color:var(--red)">${money(spendCat[c])}</b></div>`}).join('')}</div>`;
  h+=`<div class="tiles t2"><div class="tile big"><small>Чистый спирт</small><b>≈ ${Math.round(E).toLocaleString('ru-RU')} мл</b></div><div class="tile big"><small>В среднем за день с алкоголем</small><b>${cnt?fL(L/cnt):0} л</b></div></div>`;
  h+=tabs('scat',[['all','Все категории'],...CAT_IDS.map(c=>[c,c==='strong'?'Крепкий':CATS[c].n])],sCat);
  const ser=f=>(sCat==='all'?CAT_IDS:[sCat]).map(c=>({c:CATS[c].c,vals:bs.map(b=>b.keys.reduce((s,k)=>s+getDay(k).a.filter(e=>e.c===c).reduce((t,e)=>t+f(e),0),0))}));
  const unit=bs[0]&&bs[0].keys.length>1?'месяцам':'дням';
  h+=`<div class="sec">Выпито по ${unit}, л</div>`+chart(bs,ser(e=>e.v*e.n/1000),fmtAx);
  h+=`<div class="sec">Расходы по ${unit}, ${esc(state.settings.cur)}</div>`+chart(bs,ser(e=>e.p*e.n),fmtAx);
  h+=`<div class="total"><span>Общие расходы за период</span><b>${money(P)}</b></div>`;
  const best=(f)=>{let bk=null,bv=0;for(const k of days)if(perDay[k][f]>bv){bv=perDay[k][f];bk=k}return bk};
  const bl=best('L'),bp=best('P');
  h+=`<div class="kv"><span>Самый пьющий день</span><b>${bl?dShort(bl)+' · '+fL(perDay[bl].L)+' л':'—'}</b></div><div class="kv"><span>Самый затратный день</span><b>${bp?dShort(bp)+' · '+money(perDay[bp].P):'—'}</b></div>`;
  return h;
}
function statsHk(days,bs){
  const place={home:0,lounge:0,guest:0},str={light:0,medium:0,strong:0},mix={};let N=0,P=0,M=0;const perDay={};
  for(const k of days){const r=getDay(k);let dp=0;for(const e of r.h){place[e.pl]++;str[e.st]++;P+=e.p;dp+=e.p;M+=e.min;const mx=e.mix.trim().toLowerCase();if(mx)mix[mx]=(mix[mx]||0)+1}N+=r.h.length;perDay[k]={n:r.h.length,P:dp}}
  const pc={home:'#a78bfa',lounge:'#7b5cf0',guest:'#4c33b8'};
  const parts=Object.keys(place).filter(p=>place[p]).map(p=>({id:p,v:place[p],c:pc[p]}));
  const flags=days.map(k=>perDay[k].n>0),[on,off]=streaks(flags),cnt=flags.filter(Boolean).length;
  let h=`<div class="donutw"><div class="donut" style="background:${donut(parts)}"><div class="hole"><small>Всего</small><b>${N}</b><small>${pl(N,'кальян','кальяна','кальянов')}</small></div></div>
  <div class="tags">${parts.length?parts.map(p=>`<span class="tag" style="background:${p.c}">${PLACES[p.id]} ${p.v}</span>`).join(''):'<span class="empty" style="padding:0">Нет записей за период</span>'}</div></div>`;
  h+=`<div class="band3 hkc"><div><b>${cnt}</b><small>${pl(cnt,'день','дня','дней')} с кальяном</small></div><div><b>${on}</b><small>макс. дней подряд курили</small></div><div><b>${off}</b><small>макс. дней подряд без кальяна</small></div></div>`;
  const favS=N?Object.entries(str).sort((a,b)=>b[1]-a[1])[0][0]:null;
  h+=`<div class="tiles t2"><div class="tile big"><small>Время за кальяном</small><b>${(+(M/60).toFixed(1)).toLocaleString('ru-RU')} ч</b></div><div class="tile big"><small>Средняя цена</small><b>${N?money(P/N):'—'}</b></div></div>`;
  h+=`<div class="sec">Крепость табака</div>${Object.entries(STR).map(([v,n])=>`<div class="hbar"><span>${n}</span><span class="tr"><i style="width:${N?str[v]/N*100:0}%"></i></span><span>${str[v]}</span></div>`).join('')}`;
  const unit=bs[0]&&bs[0].keys.length>1?'месяцам':'дням';
  h+=`<div class="sec">Кальяны по ${unit}</div>`+chart(bs,[{c:'var(--hk)',vals:bs.map(b=>b.keys.reduce((s,k)=>s+perDay[k].n,0))}],v=>Number.isInteger(v)?String(v):'');
  h+=`<div class="sec">Расходы по ${unit}, ${esc(state.settings.cur)}</div>`+chart(bs,[{c:'var(--hk)',vals:bs.map(b=>b.keys.reduce((s,k)=>s+perDay[k].P,0))}],fmtAx);
  h+=`<div class="total hkc"><span>Расходы на кальян за период</span><b>${money(P)}</b></div>`;
  let bk=null,bv=0;for(const k of days)if(perDay[k].n>bv){bv=perDay[k].n;bk=k}
  const favMix=Object.entries(mix).sort((a,b)=>b[1]-a[1])[0];
  h+=`<div class="kv"><span>Самый дымный день</span><b class="v">${bk?dShort(bk)+' · '+bv:'—'}</b></div><div class="kv"><span>Любимая крепость</span><b class="v">${favS?STR[favS]:'—'}</b></div><div class="kv"><span>Частый микс</span><b class="v">${favMix?esc(favMix[0]):'—'}</b></div>`;
  return h;
}

/* ---------- настройки ---------- */
function vSet(){
  const st={cloud:['cloud','Сохраняется в облаке Telegram — доступно с любого устройства, где вы открываете бота'],loading:['','Загружаю данные из Telegram…'],err:['err','Нет связи с облаком Telegram — данные пока сохранены только на этом устройстве'],local:['',TW&&!tg?'Откройте приложение через бота в Telegram, чтобы данные сохранялись в облаке. Сейчас — только в этом браузере':'Открыто вне Telegram: данные хранятся только в этом браузере']}[sync];
  const cust=state.settings.custom.filter(c=>!c.hidden);
  return top('Настройки')+`
  <div class="set"><h3>Хранение данных</h3><div class="status ${st[0]}"><i></i>${st[1]}</div></div>
  <div class="set"><h3>Валюта</h3><div class="chips">${['₽','$','€','₸','₴','£','₾'].map(c=>`<button class="chip ${state.settings.cur===c?'on':''}" data-act="cur" data-v="${c}">${c}</button>`).join('')}</div></div>
  <div class="set"><h3>Мои напитки</h3>${cust.length?`<div class="list" style="margin:0">${cust.map(c=>`<div class="item" style="background:var(--bg)">${glass(CATS[c.cat].g,CATS[c.cat].col)}<div class="tx"><b>${esc(c.name)}</b><small>${CATS[c.cat].n}${c.abv?' · '+c.abv+'%':''}</small></div><button class="del" data-act="cdel" data-id="${esc(c.id)}" aria-label="Удалить">×</button></div>`).join('')}</div>`:'<p>Пока нет. Добавить можно на экране дня → «Добавить свой алкоголь».</p>'}</div>
  <div class="set"><h3>Резервная копия</h3><p>Скопируйте данные в заметки или файл — так их можно перенести в другую версию приложения.</p>
    <button class="btn ghost" data-act="export" style="margin-top:0;background:var(--bg)">Скопировать данные (JSON)</button>
    <p style="margin:14px 0 6px">Вставьте JSON, чтобы восстановить данные (текущие будут заменены):</p>
    <textarea id="imp" placeholder='{"days":{...},"settings":{...}}'></textarea>
    <button class="btn ghost" data-act="import" style="background:var(--bg)">Восстановить из JSON</button></div>
  <div class="set"><h3>Удалить все данные</h3><p>Записи о днях, кальянах и свои напитки будут удалены без возможности восстановления.</p><button class="btn" data-act="wipe" style="margin-top:0">Удалить всё</button></div>`;
}

/* ---------- нижняя шторка ---------- */
function openSheet(html){$('#sheet').innerHTML='<div class="grab"></div>'+html;$('#sheet').classList.add('open');$('#veil').classList.add('open');backBtn()}
function closeSheet(){$('#sheet').classList.remove('open');$('#veil').classList.remove('open');sh=null;backBtn()}
function sheetDrink(id){
  const d=drink(id),r=getDay(dayKey),rows={};
  for(const c of CONT[d.cat]){const e=r.a.find(x=>x.d===id&&x.x===c[0]);rows[c[0]]={n:e?e.n:0,p:e?e.p:''}}
  const o=r.a.find(x=>x.d===id&&x.x==='o');
  sh={type:'drink',id,rows,other:{v:o?+(o.v*o.n/1000).toFixed(3):'',p:o?o.p*o.n:''}};
  openSheet(`<h3>${esc(d.name)}</h3><p class="sub">${dLong(dayKey)}${d.range?' · крепость '+esc(d.range):''}</p>
  <div class="conts">${CONT[d.cat].map(c=>`<div class="ct">${glass(c[3],d.col)}<b>${c[1]}</b><small>${c[2]} мл</small>
    <div class="step"><button data-act="st" data-x="${c[0]}" data-d="-1" aria-label="Меньше">−</button><span id="n-${c[0]}">${rows[c[0]].n}</span><button data-act="st" data-x="${c[0]}" data-d="1" aria-label="Больше">+</button></div>
    <input class="inp" inputmode="decimal" placeholder="цена за штуку" data-px="${c[0]}" value="${esc(rows[c[0]].p||'')}"></div>`).join('')}
    <div class="ct">${glass('pint','transparent')}<b>Другое</b><small>свой объём</small>
    <input class="inp" inputmode="decimal" placeholder="объём, л" id="ov" value="${esc(sh.other.v)}"><input class="inp" inputmode="decimal" placeholder="цена" id="op" value="${esc(sh.other.p||'')}"></div></div>
  <button class="btn" data-act="dsave">Готово</button>`);
}
function sheetCustom(){
  sh={type:'custom',cat:dayCat};
  openSheet(`<h3>Свой напиток</h3><p class="sub">Появится в выбранной категории</p>
  <div class="field"><label for="cn">Название</label><input class="inp" id="cn" maxlength="40" placeholder="Например, Апероль шприц"></div>
  <div class="field"><span class="lbl">Категория</span><div class="chips" id="ccats">${CAT_IDS.map(c=>`<button class="chip ${c===dayCat?'on':''}" data-act="ccat" data-v="${c}">${CATS[c].n}</button>`).join('')}</div></div>
  <div class="field"><label for="ca">Крепость, %</label><input class="inp" id="ca" inputmode="decimal" placeholder="11"></div>
  <button class="btn" data-act="csave">Добавить</button>`);
}
function sheetConfirm(text,act,label){sh={type:'confirm'};openSheet(`<h3>${text}</h3><button class="btn" data-act="${act}">${label}</button><button class="btn ghost" data-act="close" style="margin-top:8px">Отмена</button>`)}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1800)}

/* ---------- события ---------- */
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='hkp')hk.p=t.value;else if(t.id==='hkmix')hk.mix=t.value;
  else if(sh&&sh.type==='drink'){if(t.dataset.px)sh.rows[t.dataset.px].p=t.value;else if(t.id==='ov')sh.other.v=t.value;else if(t.id==='op')sh.other.p=t.value}
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;
  switch(a){
    case 'nav':view=v;window.scrollTo(0,0);break;
    case 'calmode':calMode=v;break;
    case 'mon':{const d=new Date(cal.y,cal.m+ +b.dataset.d,1);cal={y:d.getFullYear(),m:d.getMonth()};break}
    case 'yr':cal.y+= +b.dataset.d;break;
    case 'gomon':cal.m=+b.dataset.m;calMode='month';break;
    case 'day':dayKey=b.dataset.k;view='day';{const r=getDay(dayKey);dayMode=!r.a.length&&r.h.length?'hk':'alc'}window.scrollTo(0,0);break;
    case 'tocal':{const d=parse(dayKey);cal={y:d.getFullYear(),m:d.getMonth()};view='cal';break}
    case 'dd':{const n=key(addDays(parse(dayKey),+b.dataset.d));if(n<=key(today()))dayKey=n;break}
    case 'dmode':dayMode=v;break;
    case 'dcat':dayCat=v;break;
    case 'drink':sheetDrink(b.dataset.id);return;
    case 'addcustom':sheetCustom();return;
    case 'adel':{const r=clone(getDay(dayKey));r.a.splice(+b.dataset.i,1);putDay(dayKey,r);break}
    case 'hdel':{const r=clone(getDay(dayKey));r.h.splice(+b.dataset.i,1);putDay(dayKey,r);break}
    case 'hk':hk[b.dataset.f]=b.dataset.f==='min'?(hk.min===+v?0:+v):v;break;
    case 'hkadd':{const r=clone(getDay(dayKey));r.h.push({pl:hk.pl,st:hk.st,min:hk.min,p:num(hk.p),mix:hk.mix.trim().slice(0,80)});putDay(dayKey,r);hap('ok');toast('Кальян добавлен');break}
    case 'per':per=v;break;
    case 'smode':sMode=v;break;
    case 'scat':sCat=v;break;
    case 'cur':state.settings.cur=v;save('settings');break;
    case 'close':closeSheet();return;
    case 'st':{const x=b.dataset.x,row=sh.rows[x];row.n=Math.max(0,Math.min(99,row.n+ +b.dataset.d));hap();$('#n-'+x).textContent=row.n;return}
    case 'dsave':{
      const d=drink(sh.id),r=clone(getDay(dayKey));
      r.a=r.a.filter(x=>x.d!==sh.id);
      for(const c of CONT[d.cat]){const row=sh.rows[c[0]];if(row.n>0)r.a.push({c:d.cat,d:sh.id,x:c[0],v:c[2],n:row.n,p:num(row.p)})}
      const ov=num(sh.other.v);if(ov>0)r.a.push({c:d.cat,d:sh.id,x:'o',v:Math.round(ov*1000),n:1,p:num(sh.other.p)});
      putDay(dayKey,r);hap('ok');closeSheet();break}
    case 'ccat':sh.cat=v;document.querySelectorAll('#ccats .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===v));return;
    case 'csave':{const name=$('#cn').value.trim();if(!name){$('#cn').focus();return}
      state.settings.custom.push({id:'u'+Date.now().toString(36),cat:sh.cat,name:name.slice(0,40),abv:Math.min(100,num($('#ca').value)),hidden:false});
      dayCat=sh.cat;save('settings');closeSheet();break}
    case 'cdel':{const c=state.settings.custom.find(x=>x.id===b.dataset.id);if(c)c.hidden=true;save('settings');break}
    case 'export':{const txt=JSON.stringify(state);try{await navigator.clipboard.writeText(txt);toast('Скопировано')}catch(err){$('#imp').value=txt;$('#imp').select();toast('Выделите текст и скопируйте')}return}
    case 'import':{let s;try{s=normState(JSON.parse($('#imp').value))}catch(err){toast('Не получилось прочитать JSON');return}
      sheetConfirm('Заменить текущие данные на вставленные?','doimport','Заменить');sh.data=s;return}
    case 'doimport':{const old=Object.keys(state.days).map(monthOf);state=sh.data;old.concat(Object.keys(state.days).map(monthOf),['settings']).forEach(m=>dirty.add(m));save();closeSheet();toast('Данные восстановлены');break}
    case 'wipe':sheetConfirm('Удалить все данные?','dowipe','Удалить');return;
    case 'dowipe':{Object.keys(state.days).map(monthOf).concat(['settings']).forEach(m=>dirty.add(m));state={days:{},settings:{cur:state.settings.cur,custom:[]}};save();closeSheet();toast('Данные удалены');break}
    default:return;
  }
  render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sh)closeSheet()});

render();
initCloud();
}
</script>
